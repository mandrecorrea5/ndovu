services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      NDOVU_APP_DOMAIN: "${NDOVU_APP_DOMAIN-${NDOVU_BOOTSTRAP_IPS-}}"
      NDOVU_API_DOMAIN: "${NDOVU_API_DOMAIN-${NDOVU_BOOTSTRAP_IPS-}}"
      NDOVU_TLS_EMAIL: "${NDOVU_TLS_EMAIL:?Set NDOVU_TLS_EMAIL}"
      # 1ª subida sem DNS (IP da VPS + hash de senha): publica a VPS por IP
      # com TLS auto-signado e Basic Auth global. Esvaziar ao apontar o
      # domínio. Ver comentário no topo do Caddyfile.
      NDOVU_BOOTSTRAP_IPS: "${NDOVU_BOOTSTRAP_IPS-}"
      NDOVU_BOOTSTRAP_PASSWORD_HASH: "${NDOVU_BOOTSTRAP_PASSWORD_HASH-}"
      # Basic Auth de /metrics (usuário ndovu). Hash bcrypt
      # (caddy hash-password) — a senha clara vive só no cofre do monitoramento.
      NDOVU_METRICS_PASSWORD_HASH: "${NDOVU_METRICS_PASSWORD_HASH:?Set NDOVU_METRICS_PASSWORD_HASH}"
    # 80/443 nesta VPS estão com a stack StayCloud/Traefik (GMZ).
    # Para a 1ª subida sem domínio, só o 8443 é publicado — é por ele
    # que o smoke e o ingest passam (http→https redirect não funciona
    # atrás de Traefik).
    ports: !override
      - "8443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/bootstrap-body:/etc/caddy/bootstrap-body:ro
      - ./infra/caddy/site-body:/etc/caddy/site-body:ro
      - ./infra/caddy/site-body-api:/etc/caddy/site-body-api:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Caddy sobe com a stack funcional atrás. O proxy do dashboard usa a
      # URL interna http://api:8080 (rede do compose), então a ordem real é
      # api → dashboard → caddy.
      api:
        condition: service_started
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    # 2019 (admin API) é localhost-only dentro do container; nada publicado.
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  clickhouse:
    restart: unless-stopped
    ports: !reset []
    volumes:
      - chdata:/var/lib/clickhouse
      - chdata-warm:/warm
      - ./infra/clickhouse/storage-r2.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      # Teto de 1,5 GB por consulta (docs/CAPACITY-VPS.md §2.1): estourar o
      # limite do container mataria a stack inteira; a consulta falha antes.
      - ./infra/clickhouse/tuning-prod.xml:/etc/clickhouse-server/config.d/tuning.xml:ro
    environment:
      NDOVU_CLICKHOUSE_S3_ENDPOINT: "${NDOVU_CLICKHOUSE_S3_ENDPOINT:?Set NDOVU_CLICKHOUSE_S3_ENDPOINT}"
      NDOVU_CLICKHOUSE_S3_ACCESS_KEY: "${NDOVU_CLICKHOUSE_S3_ACCESS_KEY:?Set NDOVU_CLICKHOUSE_S3_ACCESS_KEY}"
      NDOVU_CLICKHOUSE_S3_SECRET_KEY: "${NDOVU_CLICKHOUSE_S3_SECRET_KEY:?Set NDOVU_CLICKHOUSE_S3_SECRET_KEY}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:?Set CLICKHOUSE_DB}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}"
    # ClickHouse + cold tier no R2 + agregações. 4 GB com teto de 1,5 GB por
    # consulta (tuning-prod.xml): a soma de limites cabe nos 8 GB da VPS —
    # ver docs/CAPACITY-VPS.md §2.
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "3"

  # API e writer: a única fonte de verdade de saúde é /health (que valida as
  # conexões). Sem ele, um contêiner "up" com DB fora seria tratado como sábio.
  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      NDOVU_ENV: production
      NDOVU_POSTGRES_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?sslmode=disable"
      NDOVU_CLICKHOUSE_DB: "${CLICKHOUSE_DB:?Set CLICKHOUSE_DB}"
      NDOVU_CLICKHOUSE_USER: "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER}"
      NDOVU_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}"
      NDOVU_AUTH_SECRET: "${NDOVU_AUTH_SECRET:?Set NDOVU_AUTH_SECRET}"
      NDOVU_ADMIN_EMAIL: "${NDOVU_ADMIN_EMAIL:?Set NDOVU_ADMIN_EMAIL}"
      NDOVU_ADMIN_PASSWORD: "${NDOVU_ADMIN_PASSWORD:?Set NDOVU_ADMIN_PASSWORD}"
      NDOVU_SESSION_ENC_KEY: "${NDOVU_SESSION_ENC_KEY:?Set NDOVU_SESSION_ENC_KEY}"
      NDOVU_BOOTSTRAP_INGEST_KEY: ""
      NDOVU_CORS_ORIGINS: "${NDOVU_CORS_ORIGINS:?Set NDOVU_CORS_ORIGINS}"
      NDOVU_S3_ENDPOINT: "${NDOVU_S3_ENDPOINT:?Set NDOVU_S3_ENDPOINT}"
      NDOVU_S3_ACCESS_KEY: "${NDOVU_S3_ACCESS_KEY:?Set NDOVU_S3_ACCESS_KEY}"
      NDOVU_S3_SECRET_KEY: "${NDOVU_S3_SECRET_KEY:?Set NDOVU_S3_SECRET_KEY}"
      NDOVU_S3_USE_SSL: "true"
      NDOVU_SNAPSHOT_BUCKET: "${NDOVU_SNAPSHOT_BUCKET:?Set NDOVU_SNAPSHOT_BUCKET}"
      # VPS 8 GB (docs/CAPACITY-VPS.md §4): 12h de stream. ClickHouse fora
      # por MAIS que isso = descarte dos mais antigos. Monitorar idade do
      # backlog (platform/runbooks/jetstream-backlog.md).
      NDOVU_STREAM_MAX_AGE_HOURS: "12"
    # Imagem distroless (nonroot): sem shell, sem wget/curl — não há
    # healthcheck possível dentro do container. Liveness vem do restart
    # policy + process exit; readiness (/health) é consumida pelo
    # monitoramento externo (Prometheus blackbox / uptime). Ver DEPLOY-VPS.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  writer:
    restart: unless-stopped
    environment:
      NDOVU_ENV: production
      NDOVU_POSTGRES_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?sslmode=disable"
      NDOVU_CLICKHOUSE_DB: "${CLICKHOUSE_DB:?Set CLICKHOUSE_DB}"
      NDOVU_CLICKHOUSE_USER: "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER}"
      NDOVU_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}"
      NDOVU_S3_ENDPOINT: ""
      NDOVU_S3_ACCESS_KEY: ""
      NDOVU_S3_SECRET_KEY: ""
      # Mesmo teto de idade do stream — api e writer devem ver a mesma janela
      # (docs/CAPACITY-VPS.md §4).
      NDOVU_STREAM_MAX_AGE_HOURS: "12"
    # O writer depende de NATS para consumir; sem ele o writer fica ocioso e
    # a fila incha sem ninguém reclamar. No compose base a dependência não
    # existia — em produção isso é obrigatório.
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  dashboard:
    restart: unless-stopped
    ports: !reset []
    build:
      args:
        # O BFF usa a URL interna (rede do compose) para server-to-server.
        # NEXT_PUBLIC_* ainda é embutido no build por compatibilidade, mas a
        # UI é same-origin e não o usa mais.
        NEXT_PUBLIC_NDOVU_API: "http://api:8080"
    environment:
      # Segredo de cifra da sessão (AES-GCM). O mesmo valor que a API valida
      # presença em produção.
      NDOVU_SESSION_ENC_KEY: "${NDOVU_SESSION_ENC_KEY:?Set NDOVU_SESSION_ENC_KEY}"
      # URL interna usada pelo BFF para falar com a API.
      NDOVU_API: "http://api:8080"
      HOSTNAME: "0.0.0.0"
    depends_on:
      # API distroless não tem healthcheck (ver RUNBOOK-DEPLOY); a ordem
      # api→dashboard→caddy continua garantida pelo healthcheck do
      # dashboard (compose 5.x exige o healthcheck para service_healthy).
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1"

  nats:
    restart: unless-stopped
    ports: !reset []
    # Monitor 8222 (healthz) já é definido no compose base; fica restrito à
    # rede interna do compose (nenhum mapeamento publicado no prod).
    # 1 GB limita a janela do JetStream (docs/CAPACITY-VPS.md §2).
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  mailhog:
    ports: !reset []

  minio:
    ports: !reset []
    profiles:
      - local-minio

  minio-init:
    profiles:
      - local-minio

  postgres-backup:
    profiles:
      - backup
    build:
      context: ./infra/backup
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB}"
      AWS_ACCESS_KEY_ID: "${NDOVU_PG_BACKUP_S3_ACCESS_KEY:?Set NDOVU_PG_BACKUP_S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${NDOVU_PG_BACKUP_S3_SECRET_KEY:?Set NDOVU_PG_BACKUP_S3_SECRET_KEY}"
      AWS_DEFAULT_REGION: auto
      NDOVU_BACKUP_S3_ENDPOINT: "${NDOVU_PG_BACKUP_S3_ENDPOINT:?Set NDOVU_PG_BACKUP_S3_ENDPOINT}"
      NDOVU_BACKUP_BUCKET: "${NDOVU_PG_BACKUP_BUCKET:?Set NDOVU_PG_BACKUP_BUCKET}"
      NDOVU_BACKUP_AGE_RECIPIENT: "${NDOVU_PG_BACKUP_AGE_RECIPIENT:?Set NDOVU_PG_BACKUP_AGE_RECIPIENT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
